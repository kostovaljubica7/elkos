    <style>
        :root { --ink: #1d2433; --muted: #5b6475; --accent: #f0a500; --card: #ffffff; --bg: #f5f6f8; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) { --ink: #eef0f4; --muted: #aab1bf; --card: #1f2431; --bg: #151922; }
        }
        :root[data-theme="dark"] { --ink: #eef0f4; --muted: #aab1bf; --card: #1f2431; --bg: #151922; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        main { width: 100%; max-width: 480px; text-align: center; }
        h1 { font-size: 1.75rem; margin: 0 0 8px; font-weight: 800; }
        p { color: var(--muted); margin: 0 0 28px; }
        .choices { display: grid; gap: 14px; }
        .choice {
            display: block; padding: 20px; border-radius: 14px; background: var(--card);
            color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1.15rem;
            border: 2px solid transparent; box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
        .choice:hover, .choice:focus-visible { border-color: var(--accent); outline: none; }
        .choice small { display: block; font-weight: 500; color: var(--muted); font-size: .9rem; margin-top: 4px; }
